name: Deploy to Cloudflare Pages

# The whole deploy: every TypeScript game, each to its own Cloudflare Pages
# project, one matrix entry per game —
#
#   apps/hypersweeper  ->  the `hypersweeper` project, https://hypersweeper.pages.dev
#   apps/reptiles      ->  the `rep-tiles` project,    https://rep-tiles.pages.dev
#
# Each entry builds its game and runs wrangler from the game's folder, whose
# wrangler.toml names the project. This is the only thing that publishes them;
# the pygame build stays in the repo as the reference implementation and goes
# nowhere. A new game is a new matrix entry (and a Pages project created once in
# the Cloudflare dashboard, with `master` as its production branch).
#
# Each game is served from its domain root, which is `VITE_BASE`'s default, so
# nothing here sets it. That path is baked into the bundle at build time —
# asset URLs, the PWA manifest and the service worker scope all derive from it
# — so serving the same artifact from a subdirectory would take its own build.
# No source file hardcodes it either (public/next/index.html redirects with a
# relative "../").
#
# The game used to be deployed to GitHub Pages as well, from a second workflow
# building the same commit under /hypersweeper/. That is gone;
# redirect-pages.yml now publishes a one-page redirect there instead.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Deploys are not worth queueing: a newer commit supersedes an older one.
concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: deploy (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      # One game's failed deploy must not cancel the other's.
      fail-fast: false
      matrix:
        include:
          # Hypersweeper carries the anonymous play counter, and this is the one
          # host that serves the Pages Function it posts to (functions/api/tally.ts);
          # elsewhere the post would 404 and the browser would log it. Its URL
          # can be overridden from a custom domain with the repository variable
          # SITE_URL, which takes no code change.
          - app: hypersweeper
            analytics: "1"
            site: https://hypersweeper.pages.dev/
          # Rep-tiles has no counter and no Functions.
          - app: reptiles
            analytics: ""
            site: https://rep-tiles.pages.dev/
    # Skip the automated version-bump commits. Belt and braces: bump-version.yml
    # pushes with the default GITHUB_TOKEN, and a GITHUB_TOKEN push triggers no
    # workflow, so that commit does not reach here anyway — but it would the day
    # that token becomes a PAT.
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'Bump version to')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Build ${{ matrix.app }} (site root)
        working-directory: apps/${{ matrix.app }}
        # No VITE_BASE: the shared preset defaults to "/", which is what
        # Cloudflare serves from.
        env:
          VITE_ANALYTICS: ${{ matrix.analytics }}
          # Absolute origin + base, for the link-preview tags (og:url, og:image);
          # a crawler runs no JavaScript, so these are fixed at build time. The
          # fallback is the Pages project's own domain, so this is right with no
          # configuration.
          VITE_SITE_URL: ${{ (matrix.app == 'hypersweeper' && vars.SITE_URL) || matrix.site }}
        run: |
          # The npm workspace (every app in apps/) installs from the repo root.
          (cd ../.. && npm ci)
          npm run build
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # From the game's folder, so wrangler resolves its project root there
          # and finds both its wrangler.toml (the project name) and — for
          # Hypersweeper, the reason for this — its functions/, which serves
          # /api/tally. A deploy run from the repo root uploads dist/ alone and
          # the collector silently does not exist.
          workingDirectory: apps/${{ matrix.app }}
          # No directory argument and no --project-name: both come from
          # wrangler.toml (`pages_build_output_dir` and `name`), and passing the
          # directory positionally alongside that config is an error.
          #
          # `--branch` decides production vs preview: Cloudflare compares it
          # against the project's production branch, so this must match the
          # `--production-branch` the project was created with.
          command: pages deploy --branch=master
