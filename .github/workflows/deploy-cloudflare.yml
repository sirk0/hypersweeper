name: Deploy to Cloudflare Pages

# The second of two deploys running side by side during the move off GitHub
# Pages. Both build the same TypeScript app from the same commit; the only
# difference is `VITE_BASE`, because the two hosts serve it from different
# paths:
#
#   GitHub Pages    project site  →  /hypersweeper/   (deploy-pages.yml)
#   Cloudflare      domain root   →  /                (here)
#
# That path is baked into the bundle at build time — asset URLs, the PWA
# manifest and the service worker scope all derive from it — so one artifact
# cannot serve both and each host gets its own build. Nothing else differs,
# and no source file hardcodes the base (public/next/index.html redirects
# with a relative "../", so it works under either).
#
# When GitHub Pages goes away, delete deploy-pages.yml and this file is the
# whole deploy.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Deploys are not worth queueing: a newer commit supersedes an older one, and
# the group is separate from the Pages deploy so the two never block each
# other.
concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skip the automated version-bump commits, exactly as the Pages deploy
    # does, so both hosts stay on the same build.
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'Bump version to')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build TypeScript app (site root)
        working-directory: web
        # No VITE_BASE: vite.config.ts defaults to "/", which is what
        # Cloudflare serves from.
        env:
          # This is the one host that serves the Pages Function the anonymous
          # play counter posts to, so it is the one build that carries the
          # counter. Elsewhere the post would 404 and the browser would log it.
          VITE_ANALYTICS: "1"
          # Absolute origin + base, for the link-preview tags (og:url, og:image);
          # a crawler runs no JavaScript, so these are fixed at build time. Set
          # the repository variable SITE_URL to this deploy's own domain — until
          # it exists the fallback names the GitHub Pages site, which previews
          # correctly but points shares at the other host.
          VITE_SITE_URL: ${{ vars.SITE_URL || 'https://sirk0.github.io/hypersweeper/' }}
        run: |
          npm ci
          npm run build
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # From web/, so wrangler resolves its project root there and finds
          # both web/wrangler.toml and — the reason for this — web/functions/,
          # which serves /api/tally. A deploy run from the repo root uploads
          # dist/ alone and the collector silently does not exist.
          workingDirectory: web
          # No directory argument and no --project-name: both come from
          # wrangler.toml (`pages_build_output_dir` and `name`), and passing the
          # directory positionally alongside that config is an error.
          #
          # `--branch` decides production vs preview: Cloudflare compares it
          # against the project's production branch, so this must match the
          # `--production-branch` the project was created with.
          command: pages deploy --branch=master
