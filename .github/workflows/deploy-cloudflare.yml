name: Deploy to Cloudflare Pages

# The whole deploy. The TypeScript app in web/ is the published game and this
# is the only thing that publishes it; the pygame build stays in the repo as
# the reference implementation and goes nowhere.
#
# The app is served from the domain root, which is `VITE_BASE`'s default, so
# nothing here sets it. That path is baked into the bundle at build time —
# asset URLs, the PWA manifest and the service worker scope all derive from it
# — so serving the same artifact from a subdirectory would take its own build.
# No source file hardcodes it either (public/next/index.html redirects with a
# relative "../").
#
# The game used to be deployed to GitHub Pages as well, from a second workflow
# building the same commit under /hypersweeper/. That is gone;
# redirect-pages.yml now publishes a one-page redirect there instead.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Deploys are not worth queueing: a newer commit supersedes an older one.
concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skip the automated version-bump commits. Belt and braces: bump-version.yml
    # pushes with the default GITHUB_TOKEN, and a GITHUB_TOKEN push triggers no
    # workflow, so that commit does not reach here anyway — but it would the day
    # that token becomes a PAT.
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'Bump version to')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build TypeScript app (site root)
        working-directory: web
        # No VITE_BASE: vite.config.ts defaults to "/", which is what
        # Cloudflare serves from.
        env:
          # This is the one host that serves the Pages Function the anonymous
          # play counter posts to, so it is the one build that carries the
          # counter. Elsewhere the post would 404 and the browser would log it.
          VITE_ANALYTICS: "1"
          # Absolute origin + base, for the link-preview tags (og:url, og:image);
          # a crawler runs no JavaScript, so these are fixed at build time. The
          # fallback is the Pages project's own domain, so this is right with no
          # configuration; set the repository variable SITE_URL to override it
          # from a custom domain, which takes no code change.
          VITE_SITE_URL: ${{ vars.SITE_URL || 'https://hypersweeper.pages.dev/' }}
        run: |
          npm ci
          npm run build
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # From web/, so wrangler resolves its project root there and finds
          # both web/wrangler.toml and — the reason for this — web/functions/,
          # which serves /api/tally. A deploy run from the repo root uploads
          # dist/ alone and the collector silently does not exist.
          workingDirectory: web
          # No directory argument and no --project-name: both come from
          # wrangler.toml (`pages_build_output_dir` and `name`), and passing the
          # directory positionally alongside that config is an error.
          #
          # `--branch` decides production vs preview: Cloudflare compares it
          # against the project's production branch, so this must match the
          # `--production-branch` the project was created with.
          command: pages deploy --branch=master
