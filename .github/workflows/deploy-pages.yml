name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # skip the automated version-bump commits
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'Bump version to')
    steps:
      - uses: actions/checkout@v4
      # The TypeScript app is the deployed game and owns the site root. The
      # pygame/pygbag build is no longer published — it stays in the repo as
      # the reference implementation, still buildable locally with
      # `make web-package`. `/next/`, where the TS app lived during the
      # transition, is a redirect to the root: web/public/next/index.html,
      # copied into dist/ by Vite like any other public asset.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build TypeScript app (site root)
        working-directory: web
        env:
          VITE_BASE: /hypersweeper/
        run: |
          npm ci
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
