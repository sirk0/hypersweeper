name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# A run superseded by a newer push to the same PR is wasted work, and the `web`
# job installs a browser and runs the whole Playwright suite. Only PRs are
# cancelled: every commit on master should keep its own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    # The whole pytest run is about five minutes on a hosted runner; the limit
    # is there to catch a hang, not to budget the run.
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-test.txt
      - name: Run tests
        # GUI tests set SDL's dummy video driver themselves
        run: make test PY=python

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-test.txt
      - name: Lint
        run: make lint PY=python

  data-sync:
    # The shared JSON config (data/*.json) is the single source both front-ends
    # read. Regenerate it from the Python side and fail if it drifts from what
    # is committed (run scripts/export_data.py + export_conformance.py locally
    # and commit the result to fix).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-test.txt
      - name: Regenerate shared data
        run: |
          PYTHONPATH=. python scripts/export_data.py
          PYTHONPATH=. python scripts/export_conformance.py
      - name: Check for drift
        run: git diff --exit-code data/

  games:
    # The games in this repo, read from apps/*/packaging.json by
    # scripts/games.mjs, and the decision every PR needs: does it touch the
    # flagship (Hypersweeper)? Its web jobs are the long ones (four Playwright
    # shards), so a pull request that changes nothing outside the other games'
    # folders skips them; anything else — Hypersweeper itself, packages/, data/,
    # the root workspace files, the workflows — runs them, and so does every
    # push to master. The other games' jobs (game-checks, game-e2e) are seconds
    # of work and run on every change, one matrix entry per game, so a new game
    # (scripts/new-game.mjs) needs no edit here. A skipped job counts as passed
    # for a required check.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      others: ${{ steps.list.outputs.others }}
      hypersweeper: ${{ steps.diff.outputs.hypersweeper }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull_request run checks out the merge commit; its first parent
          # is the base branch, so two commits are enough to diff against it.
          fetch-depth: 2
      - id: list
        run: node scripts/games.mjs github >> "$GITHUB_OUTPUT"
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "hypersweeper=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only HEAD^1 HEAD | tee /dev/stderr \
            | node scripts/games.mjs flagship-needed \
            | sed 's/^/hypersweeper=/' >> "$GITHUB_OUTPUT"
      # The listing and the new-game scaffold's own unit tests (plain node).
      - name: Repo script tests
        run: node --test "scripts/test/*.test.mjs"

  web-checks:
    # Hypersweeper (apps/hypersweeper/), everything that is not Playwright:
    # typecheck, unit tests, and the two packaged-shell guards. Runs alongside
    # web-e2e rather than before it — neither is an input to the other, and the
    # e2e shards build the bundle they serve themselves.
    needs: games
    if: needs.games.outputs.hypersweeper == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/hypersweeper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      # One npm workspace for every app (the root package.json), so the
      # install runs at the root whatever this job's working directory is.
      - name: Install dependencies
        working-directory: .
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      # Prettier, configured in .prettierrc.json. `npm run format` fixes it;
      # Claude sessions format each edit through .claude/hooks/format.sh.
      - name: Formatting
        run: npm run format:check
      - name: Unit tests
        run: npm run test
      # The packaged apps (shells/desktop/ for macOS, apps/hypersweeper/ios/ for the iPhone) ship the
      # web bundle inside themselves, so the two properties that make them work
      # offline are guarded here rather than only on whoever's Mac runs
      # `make mac-app` / `make ios-app`: the packaged build must reference
      # nothing remote, and the app:// path resolver must not let the renderer
      # read outside it. Electron itself is not installed — that would be a
      # 300 MB download for a check these two steps already make. This is also
      # the only `vite build` in this job, so it doubles as the proof that the
      # bundle builds at all.
      - name: Packaged bundle is self-contained
        run: |
          VITE_PACKAGED=1 npm run build
          node ../../scripts/check-offline-assets.mjs dist
      - name: Desktop shell unit tests
        run: node --test "../../shells/desktop/test/*.test.mjs"
      # The iOS half of the same idea. Xcode and CocoaPods are macOS-only, but
      # the sync — config resolved, bundle copied into apps/hypersweeper/ios/App, plugin list
      # rebuilt — is plain node and runs here, so a broken capacitor.config.json
      # or a webDir pointing at nothing fails on every push rather than on
      # whoever next opens Xcode.
      - name: iOS project syncs
        run: |
          npx cap sync ios
          test -f ios/App/App/public/index.html

  web-e2e:
    # The Playwright e2e + visual-regression suite under deterministic software
    # WebGL (see apps/hypersweeper/playwright.config.ts). Visual baselines are only
    # authoritative under the pinned Chromium headless shell this job installs —
    # the same build apps/hypersweeper/Dockerfile.e2e's image carries and resolves the same
    # way, which is how a developer off Linux runs the gallery (it skips itself
    # on every non-Linux platform).
    #
    # Sharded because this is the whole critical path: ~228 tests, 43 of them
    # full-frame SwiftShader screenshot comparisons, took 6m27s on one runner at
    # Playwright's default of half the cores (2 on a 4-vCPU runner). Four shards
    # at four workers each is 8x the browsers. `fail-fast: false` because one
    # red shard must not cancel the other three and hide the rest of the picture.
    needs: games
    if: needs.games.outputs.hypersweeper == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: apps/hypersweeper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      # One npm workspace for every app (the root package.json), so the
      # install runs at the root whatever this job's working directory is.
      - name: Install dependencies
        working-directory: .
        run: npm ci
      # `--only-shell`, and no `--with-deps`, because measuring what the default
      # `install --with-deps chromium` bought showed 16 of its 20.5 s were
      # waste (run 34322570140):
      #
      #   5.4 s  apt-get update
      #   6.0 s  the only packages it then installs: nine *font* packages
      #          (Japanese, Chinese, Thai, Cyrillic, Unifont, FreeFont). Every
      #          library Chromium actually links is already on the runner image
      #          — the log says "is already the newest version" for all of them.
      #          The fonts are dead weight too, and that was checked rather
      #          than assumed: with those nine packages' files moved off a
      #          Linux box and fontconfig rebuilt, the whole suite still passed,
      #          all 42 gallery baselines included. Which figures — nothing here
      #          renders CJK or Cyrillic, and the four faces the app draws with
      #          (Rubik, DSEG7, Space Grotesk, Caprasimo) are bundled TTFs under
      #          apps/hypersweeper/public/fonts, reached before any system fallback.
      #   4.5 s  the full 174 MiB Chromium, which is then never launched: no
      #          project sets `channel: "chromium"` and nothing runs headed, so
      #          Playwright resolves headless to the headless shell instead
      #          (confirmed with DEBUG=pw:browser — it execs
      #          chromium_headless_shell-<build>/chrome-linux/headless_shell).
      #   2.5 s  the 104 MiB headless shell — the binary that draws every pixel
      #          in tests/e2e/gallery.spec.ts-snapshots.
      #
      # So: install the shell, skip the browser nothing opens, and take the
      # system libraries from the runner image. Both ways this can rot are
      # loud, not silent-wrong — give a project a `channel` or a headed run and
      # Playwright stops with "Executable doesn't exist"; let GitHub trim the
      # image and Chromium fails to launch. Neither can quietly move a pixel.
      #
      # Not cached. What is left is a 0.6 s download and a 1.9 s unzip, and an
      # actions/cache restore of the same ~120 MiB costs about that much — four
      # times per run, against one save. Playwright's own CI guide declines to
      # recommend browser caching for exactly this reason.
      - name: Install Playwright Chromium headless shell
        run: npx playwright install --only-shell chromium
      - name: E2E + visual tests (shard ${{ matrix.shard }}/4)
        run: npx playwright test --shard=${{ matrix.shard }}/4
        env:
          # Three, not four, on the runner's four vCPUs. A SwiftShader Chromium
          # is CPU-bound enough that one browser per core starves the lot:
          # measured on a 4-core box, four workers took the slowest shard to
          # 114 s with three tests timing out in `beforeEach` and passing on
          # retry, while three workers ran the same shard in 78 s clean. Leave
          # a core for the OS and the dev server.
          E2E_WORKERS: 3
          # The two budgets contention reaches first, raised. A page load
          # sharing a runner can miss the 30 s test timeout in a `beforeEach`
          # (that is what the four-worker flakes above were), and the expect
          # budget is what `toHaveScreenshot` captures, settles and compares a
          # 700 KB shot inside. Neither costs anything when the test passes.
          PLAYWRIGHT_TEST_TIMEOUT_MS: 60000
          PLAYWRIGHT_EXPECT_TIMEOUT_MS: 15000
          # One HTML report per shard would describe a quarter of the suite
          # each; blobs merge into a single report in web-e2e-report below.
          PLAYWRIGHT_BLOB_REPORT: 1
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: apps/hypersweeper/blob-report/
          retention-days: 1

  web-e2e-report:
    # The shards' blobs stitched back into the one browsable HTML report. Only
    # on failure: merging costs a runner and half a minute on every push, and a
    # green suite's report has never been opened.
    needs: web-e2e
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/hypersweeper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      # One npm workspace for every app (the root package.json), so the
      # install runs at the root whatever this job's working directory is.
      - name: Install dependencies
        working-directory: .
        run: npm ci
      - uses: actions/download-artifact@v4
        with:
          path: apps/hypersweeper/all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - name: Merge into one HTML report
        run: npx playwright merge-reports --reporter html ./all-blob-reports
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/hypersweeper/playwright-report/
          retention-days: 7

  packages-checks:
    # The shared packages (packages/*): typecheck, formatting and unit tests —
    # the geometry's own tests, and the boundary test that keeps every game
    # importing it as `@tiling/geometry` and no game importing another.
    # Seconds; it runs on every change.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck --workspace packages
      - name: Formatting
        run: npm run format:check --workspace packages
      - name: Unit tests
        run: npm run test --workspace packages

  game-checks:
    # Every game but Hypersweeper (which has web-checks), one matrix entry per
    # game from the games job: typecheck (which also checks the packages/
    # files it imports), formatting, unit tests, a production build, and the
    # packaged bundle the desktop shell stages — built with VITE_PACKAGED=1 and
    # checked to reference nothing remote. Seconds each; runs on every change.
    name: game-checks (${{ matrix.game }})
    needs: games
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        game: ${{ fromJSON(needs.games.outputs.others) }}
    defaults:
      run:
        working-directory: apps/${{ matrix.game }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        working-directory: .
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Formatting
        run: npm run format:check
      - name: Unit tests
        run: npm run test
      - name: Production build
        run: npx vite build
      - name: Packaged bundle is self-contained
        run: |
          VITE_PACKAGED=1 npx vite build
          node ../../scripts/check-offline-assets.mjs dist
      - name: Desktop shell unit tests
        run: node --test "../../shells/desktop/test/*.test.mjs"

  game-e2e:
    # Each of those games' Playwright smoke test against its production bundle
    # under `vite preview`: it boots under the deployed security policy (the
    # shared preset applies public/_headers there) with no console errors and
    # plays. The browser install is most of the job — the same Chromium
    # headless shell, for the same reasons, as web-e2e above.
    name: game-e2e (${{ matrix.game }})
    needs: games
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        game: ${{ fromJSON(needs.games.outputs.others) }}
    defaults:
      run:
        working-directory: apps/${{ matrix.game }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        working-directory: .
        run: npm ci
      - name: Install Playwright Chromium headless shell
        run: npx playwright install --only-shell chromium
      - name: Smoke test
        run: npx playwright test
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.game }}-playwright-report
          path: apps/${{ matrix.game }}/playwright-report/
          retention-days: 7

  template-check:
    # The new-game scaffold (scripts/new-game.mjs, templates/game/) is only
    # worth having while what it writes works. So every change scaffolds a
    # throwaway game into this checkout and puts it through what a real game
    # gets: install, typecheck, formatting, unit tests, build, the packaged
    # offline check and its Playwright smoke test. A change to the preset, a
    # package or the base tsconfig that breaks a new game fails here, on the PR
    # that made it.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/template-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      # The root install first, so Playwright's headless shell can go in before
      # the scaffold, which draws the game's icons with it.
      - name: Install dependencies
        working-directory: .
        run: npm ci
      - name: Install Playwright Chromium headless shell
        working-directory: .
        run: npx playwright install --only-shell chromium
      - name: Scaffold a game
        working-directory: .
        run: node scripts/new-game.mjs template-check "Template Check"
      - name: Typecheck
        run: npm run typecheck
      - name: Formatting
        run: npm run format:check
      - name: Unit tests
        run: npm run test
      - name: Packaged bundle is self-contained
        run: |
          VITE_PACKAGED=1 npx vite build
          node ../../scripts/check-offline-assets.mjs dist
      - name: Smoke test
        run: npx playwright test
