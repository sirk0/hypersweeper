name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# A run superseded by a newer push to the same PR is wasted work, and the `web`
# job installs a browser and runs the whole Playwright suite. Only PRs are
# cancelled: every commit on master should keep its own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-test.txt
      - name: Run tests
        # GUI tests set SDL's dummy video driver themselves
        run: make test PY=python

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install dependencies
        run: pip install -r requirements-test.txt
      - name: Lint
        run: make lint PY=python

  data-sync:
    # The shared JSON config (data/*.json) is the single source both front-ends
    # read. Regenerate it from the Python side and fail if it drifts from what
    # is committed (run scripts/export_data.py + export_conformance.py locally
    # and commit the result to fix).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-test.txt
      - name: Regenerate shared data
        run: |
          PYTHONPATH=. python scripts/export_data.py
          PYTHONPATH=. python scripts/export_conformance.py
      - name: Check for drift
        run: git diff --exit-code data/

  web:
    # TypeScript app (web/): typecheck, unit tests, production build, and the
    # Playwright e2e + visual-regression suite under deterministic software
    # WebGL (see web/playwright.config.ts). Visual baselines are only
    # authoritative under the pinned Chromium build this job installs — the same
    # one web/Dockerfile.e2e carries, which is how a developer off Linux runs
    # the gallery (it skips itself on every non-Linux platform).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E + visual tests
        run: npm run e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
      # The packaged apps (desktop/ for macOS, ios/ for the iPhone) ship this
      # same bundle inside themselves, so the two properties that make them work
      # offline are guarded here rather than only on whoever's Mac runs
      # `make mac-app` / `make ios-app`: the packaged build must reference
      # nothing remote, and the app:// path resolver must not let the renderer
      # read outside it. Electron itself is not installed — that would be a
      # 300 MB download for a check these two steps already make. It runs last
      # because it overwrites dist/ with the packaged variant.
      - name: Packaged bundle is self-contained
        run: |
          VITE_PACKAGED=1 npm run build
          node ../scripts/check-offline-assets.mjs dist
      - name: Desktop shell unit tests
        run: node --test "../desktop/test/*.test.mjs"
      # The iOS half of the same idea. Xcode and CocoaPods are macOS-only, but
      # the sync — config resolved, bundle copied into ios/App, plugin list
      # rebuilt — is plain node and runs here, so a broken capacitor.config.json
      # or a webDir pointing at nothing fails on every push rather than on
      # whoever next opens Xcode.
      - name: iOS project syncs
        run: |
          npx cap sync ios
          test -f ../ios/App/App/public/index.html
