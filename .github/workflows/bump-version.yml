name: Bump version

# Each game's patch version goes up as its changes land on master, so the
# version a build reports (its settings screen, its version.json) names a
# deployed build exactly. The bumping is scripts/bump_version.py; this decides
# which games a push bumps:
#
#   - Hypersweeper (pyproject.toml + apps/hypersweeper/package.json, which share
#     a version with the pygame build): every push, as it always has been.
#   - Rep-tiles (apps/reptiles/package.json): a push that changed what ships in
#     it — its own folder, the packages it is built from, or data/.
#
# Either is skipped when the push set that game's version itself (a minor or
# major release written by hand), so it lands as written rather than one patch
# past it. "Changed" and "set" are measured against the commit master was at
# before the push; if that cannot be read, Hypersweeper bumps as usual and
# Rep-tiles does not.

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  bump:
    # skip the commit this workflow itself pushes
    if: "!startsWith(github.event.head_commit.message, 'Bump version to')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Decide which games this push bumps
        id: check
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          git fetch --quiet --depth=1 origin "$BEFORE" || true
          pyver() { sed -n 's/^version = "\(.*\)"$/\1/p'; }
          pkgver() { python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])'; }

          hs=true
          old=$(git show "$BEFORE:pyproject.toml" 2>/dev/null | pyver || true)
          new=$(pyver < pyproject.toml)
          if [ -n "$old" ] && [ "$old" != "$new" ]; then
            echo "This push set Hypersweeper's version to $new (was $old); not bumping it."
            hs=false
          fi

          rt=false
          if changed=$(git diff --name-only "$BEFORE" HEAD 2>/dev/null); then
            if grep -qE '^(apps/reptiles/|packages/|data/)' <<<"$changed"; then
              old=$(git show "$BEFORE:apps/reptiles/package.json" 2>/dev/null | pkgver || true)
              new=$(pkgver < apps/reptiles/package.json)
              if [ -n "$old" ] && [ "$old" != "$new" ]; then
                echo "This push set Rep-tiles' version to $new (was $old); not bumping it."
              else
                rt=true
              fi
            fi
          fi
          echo "hypersweeper=$hs" >> "$GITHUB_OUTPUT"
          echo "reptiles=$rt" >> "$GITHUB_OUTPUT"
      - name: Bump and push
        if: steps.check.outputs.hypersweeper == 'true' || steps.check.outputs.reptiles == 'true'
        env:
          HS: ${{ steps.check.outputs.hypersweeper }}
          RT: ${{ steps.check.outputs.reptiles }}
        run: |
          args=()
          [ "$HS" = true ] && args+=(--hypersweeper)
          [ "$RT" = true ] && args+=(--reptiles)
          subject=$(python scripts/bump_version.py "${args[@]}")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml apps/hypersweeper/package.json apps/reptiles/package.json package-lock.json
          git commit -m "$subject"
          git push
