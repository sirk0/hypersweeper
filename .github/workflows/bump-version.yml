name: Bump version

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  bump:
    # skip the commit this workflow itself pushes
    if: "!startsWith(github.event.head_commit.message, 'Bump version to')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A push that sets the version itself — a minor or major release, written
      # into pyproject.toml, apps/hypersweeper/package.json and the lockfile by
      # hand — lands as written rather than one patch past it. Compared with the
      # commit master was at before this push; if that cannot be read, bump as
      # usual.
      - name: Skip when this push already changed the version
        id: check
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          git fetch --quiet --depth=1 origin "$BEFORE" || true
          old=$(git show "$BEFORE:pyproject.toml" 2>/dev/null | sed -n 's/^version = "\(.*\)"$/\1/p')
          new=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          if [ -n "$old" ] && [ "$old" != "$new" ]; then
            echo "This push set the version to $new (was $old); not bumping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Increment the shared version (Python + TypeScript in sync)
        id: bump
        if: steps.check.outputs.skip != 'true'
        run: |
          new_version=$(python3 - <<'EOF'
          import re
          from pathlib import Path

          # pyproject.toml is the source of truth; bump its patch level.
          py = Path("pyproject.toml")
          text = py.read_text()
          m = re.search(r'^version = "(\d+)\.(\d+)\.(\d+)"$', text, re.M)
          major, minor, patch = map(int, m.groups())
          new = f"{major}.{minor}.{patch + 1}"
          py.write_text(text[: m.start()] + f'version = "{new}"' + text[m.end():])

          # Keep the TypeScript app (apps/hypersweeper/) locked to the same version.
          pkg = Path("apps/hypersweeper/package.json")
          pkg.write_text(
              re.sub(r'("version":\s*")\d+\.\d+\.\d+(")', rf'\g<1>{new}\g<2>',
                     pkg.read_text(), count=1)
          )
          lock = Path("package-lock.json")
          lock.write_text(
              re.sub(
                  r'("name": "hypersweeper-web",\s*\n\s*"version": ")\d+\.\d+\.\d+(")',
                  rf'\g<1>{new}\g<2>', lock.read_text())
          )
          print(new)
          EOF
          )
          echo "version=$new_version" >> "$GITHUB_OUTPUT"
      - name: Commit and push
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml apps/hypersweeper/package.json package-lock.json
          git commit -m "Bump version to ${{ steps.bump.outputs.version }}"
          git push
