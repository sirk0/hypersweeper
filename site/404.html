<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Not found · Tiling games</title>
    <!--
      The shared site's 404 page, served by Cloudflare Pages for any path no
      file answers. It must exist: without a top-level 404.html Pages takes the
      site for a single-page app and answers every unknown path with
      index.html and a 200. A game with a 404.html of its own (Hypersweeper's)
      keeps it for its folder — Pages serves the nearest one up the tree.
      Absolute links, since it is served at every depth.
    -->
    <style>
      html {
        color-scheme: light dark;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 1.5rem;
      }
    </style>
  </head>
  <body>
    <main>
      <p>There is nothing here.</p>
      <p><a href="/">All the games</a></p>
    </main>
  </body>
</html>
