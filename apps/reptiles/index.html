<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="theme-color" content="#f5ead8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#191712" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Rep-tiles" />
    <title>Rep-tiles</title>
  </head>
  <body>
    <!-- The desktop's sidebar (view/groups.ts): Quick start, the tilings in
         five groups, How to play and Settings. A phone never shows it. -->
    <nav class="sidebar" id="sidebar" aria-label="Rep-tiles">
      <p class="sidebar-title">Rep-tiles</p>
      <div class="side-list">
        <button type="button" class="side-row" data-side="home">
          <span class="side-icon" id="side-quick"></span>
          <span class="side-label">Quick start</span>
        </button>
      </div>
      <p class="side-section">Tilings</p>
      <div class="side-list" id="side-groups"></div>
      <div class="side-footer">
        <button type="button" class="side-row side-small" data-side="help">
          <svg viewBox="0 0 24 24" aria-hidden="true" data-icon="help"></svg>
          <span class="side-label">How to play</span>
        </button>
        <button type="button" class="side-row side-small" data-side="settings">
          <svg viewBox="0 0 24 24" aria-hidden="true" data-icon="settings"></svg>
          <span class="side-label">Settings</span>
        </button>
      </div>
    </nav>
    <section class="screen home" id="home" hidden>
      <header class="pane-head">
        <h1 class="pane-title">Quick start</h1>
        <p class="pane-hint">A level dealt at random, by difficulty, from every tiling's boards.</p>
      </header>
      <button
        type="button"
        class="menu-header-btn home-settings"
        data-action="settings"
        title="Settings"
        aria-label="Settings"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true" data-icon="settings"></svg>
      </button>
      <button
        type="button"
        class="menu-header-btn home-help"
        data-action="help"
        title="How to play"
        aria-label="How to play"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true" data-icon="help"></svg>
      </button>
      <h1 class="home-title">Rep-tiles</h1>
      <p class="home-sub">Cover the board, tile by tile.</p>
      <div class="home-picks" id="home-picks"></div>
    </section>
    <section class="screen catalog" id="catalog" hidden>
      <header class="hud">
        <div class="hud-cluster hud-left">
          <button type="button" class="hud-btn" data-go-home title="Home" aria-label="Home">
            <svg viewBox="0 0 24 24" aria-hidden="true" data-icon="home"></svg>
          </button>
          <button type="button" class="hud-btn" data-go-back title="Back" aria-label="Back">
            <svg viewBox="0 0 24 24" aria-hidden="true" data-icon="back"></svg>
          </button>
        </div>
        <h1 class="hud-title" id="catalog-title">Tilings</h1>
        <div class="hud-cluster hud-right"></div>
      </header>
      <nav class="pane-links" id="catalog-links" aria-label="Families"></nav>
      <div class="catalog-list" id="catalog-list"></div>
    </section>
    <section class="screen catalog" id="tiling" hidden>
      <header class="hud">
        <div class="hud-cluster hud-left">
          <button type="button" class="hud-btn" data-go-home title="Home" aria-label="Home">
            <svg viewBox="0 0 24 24" aria-hidden="true" data-icon="home"></svg>
          </button>
          <button type="button" class="hud-btn" data-go-back title="Back" aria-label="Back">
            <svg viewBox="0 0 24 24" aria-hidden="true" data-icon="back"></svg>
          </button>
        </div>
        <h1 class="hud-title" id="tiling-title">Tiling</h1>
        <div class="hud-cluster hud-right"></div>
      </header>
      <div class="catalog-list" id="tiling-list"></div>
    </section>
    <section class="screen settings" id="settings" hidden>
      <header class="hud">
        <div class="hud-cluster hud-left">
          <button type="button" class="hud-btn" data-go-home title="Home" aria-label="Home">
            <svg viewBox="0 0 24 24" aria-hidden="true" data-icon="home"></svg>
          </button>
        </div>
        <h1 class="hud-title">Settings</h1>
        <div class="hud-cluster hud-right"></div>
      </header>
      <div class="settings-body" id="settings-body"></div>
    </section>
    <section class="screen settings help" id="help" hidden>
      <header class="hud">
        <div class="hud-cluster hud-left">
          <button type="button" class="hud-btn" data-go-home title="Home" aria-label="Home">
            <svg viewBox="0 0 24 24" aria-hidden="true" data-icon="home"></svg>
          </button>
        </div>
        <h1 class="hud-title">How to play</h1>
        <div class="hud-cluster hud-right"></div>
      </header>
      <div class="settings-body" id="help-body"></div>
    </section>
    <div class="screen game" id="game" hidden>
      <header class="hud">
        <div class="hud-cluster hud-left">
          <button type="button" class="hud-btn" data-go-home title="Home" aria-label="Home">
            <svg viewBox="0 0 24 24" aria-hidden="true" data-icon="home"></svg>
          </button>
          <button type="button" class="hud-btn" id="back" title="Back" aria-label="Back">
            <svg viewBox="0 0 24 24" aria-hidden="true" data-icon="back"></svg>
          </button>
        </div>
        <div class="hud-cluster hud-right">
          <button
            type="button"
            class="hud-btn"
            id="hint"
            title="Hint: a tile to lay, or one to take off (H) — no third star"
            aria-label="Hint"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true" data-icon="hint"></svg>
          </button>
          <button type="button" class="hud-btn" id="restart" title="Restart" aria-label="Restart">
            <svg viewBox="0 0 24 24" aria-hidden="true" data-icon="restart"></svg>
          </button>
          <button
            type="button"
            class="hud-btn"
            id="random"
            title="A new random level of this difficulty"
            aria-label="New random level"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true" data-icon="random"></svg>
          </button>
        </div>
      </header>
      <main id="stage">
        <p class="board-name">
          <span class="level" id="level"></span>
          <span class="board-of" id="board-of" hidden></span>
          <span class="count" id="count" aria-live="polite"></span>
          <span class="thinking" id="thinking" hidden>thinking…</span>
        </p>
        <div id="board-host"></div>
      </main>
    </div>
    <div class="won" id="won" hidden>
      <div class="won-card">
        <button
          type="button"
          id="exit"
          class="menu-header-btn won-close"
          title="Close"
          aria-label="Close"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M6 6 L18 18 M18 6 L6 18"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
            />
          </svg>
        </button>
        <p class="won-title">Tiled!</p>
        <p class="won-stars" id="won-stars"></p>
        <ul class="won-detail" id="won-detail"></ul>
        <div class="won-actions">
          <button type="button" id="again">Play again</button>
          <button type="button" id="next" class="primary">Next level</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
