<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1d1c1a" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Rep-tiles" />
    <title>Rep-tiles</title>
  </head>
  <body>
    <section class="screen home" id="home" hidden>
      <h1 class="home-title">Rep-tiles</h1>
      <p class="home-sub">Cover the board, tile by tile.</p>
      <div class="home-picks" id="home-picks"></div>
    </section>
    <section class="screen catalog" id="catalog" hidden>
      <header class="hud">
        <button type="button" class="home-button" data-go-home title="Home">‹ Home</button>
        <h1>Catalog</h1>
      </header>
      <div class="catalog-list" id="catalog-list"></div>
    </section>
    <div class="screen game" id="game" hidden>
      <header class="hud">
        <button type="button" class="home-button" data-go-home title="Home">‹ Home</button>
        <h1>Rep-tiles</h1>
        <span class="level" id="level"></span>
        <span class="count" id="count" aria-live="polite"></span>
        <span class="clock" id="clock" title="Time, against the limit for the third star"></span>
        <button type="button" id="restart">Restart</button>
      </header>
      <div class="play">
        <main id="stage"></main>
        <nav class="levels" aria-label="Levels">
          <h2>Levels</h2>
          <ol id="levels"></ol>
        </nav>
      </div>
    </div>
    <div class="won" id="won" hidden>
      <div class="won-card">
        <p class="won-title">Tiled!</p>
        <p class="won-stars" id="won-stars"></p>
        <ul class="won-detail" id="won-detail"></ul>
        <div class="won-actions">
          <button type="button" id="again">Play again</button>
          <button type="button" id="next">Next level</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
